<h1>Matrícula - Escola Online</h1>
<form action="/cadastro" method="post">
    <fieldset>
        <legend>Dados Pessoais</legend>
        <label for="Nome"> Nome Completo:</label>
        <input type="text" id="Nome" name="Nome">
        <br>
        <br>
        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento" name="nascimento">
        <br>
        <br>
        <label for="email">E-mail do Aluno:</label>
        <input type="text" id="email" name="email" placeholder="aluno@exemplo.com">
        <br>
        <br>
        <label for="senha">Senha de Acesso:</label>
        <input type="password" id="senha" name="senha">
        <br>
        <br>
        <label for="telefone">Telefone de Emergência:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00)-00000-0000">
    </fieldset>

<fieldset>
<legend>Preferências de Estudo</legend>
<p>Áreas de Interesse:</p>
<input type="checkbox" id="frontend" name="estudo">
<label for="frontend"> Front-end</label>
<br>
<input type="checkbox" id="backend" name="estudo">
<label for="backend"> Back-end</label>
<br>
<input type="checkbox" id="design" name="estudo">
<label for="design"> Design</label>
<br>
<input type="checkbox" id="dados" name="estudo">
<label for="dados">Dados</label>
<br>
<br>
<label for="escola">Como conheceu a escola?</label>
<select id="escola" name="escola">
<option value=""> Indicação </option>
</select>
</fieldset>
<br>
<button type="submit">Matricular</button>
<button type="reset">Limpar</button>
